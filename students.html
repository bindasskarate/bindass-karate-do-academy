<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students | Bindass Karate Do Academy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

/* HEADER */
.header {
    background: #111;
    color: white;
    padding: 18px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.header h1 {
    font-size: 22px;
}

.header p {
    color: #ccc;
    font-size: 13px;
    margin-top: 4px;
}

/* MAIN */
.container {
    width: min(1200px, 94%);
    margin: 25px auto;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.top-bar h2 {
    font-size: 24px;
}

.add-btn {
    border: none;
    background: #d92626;
    color: white;
    padding: 13px 20px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    background: #b91c1c;
}

/* SEARCH */
.search-box {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 20px;
    font-size: 15px;
    outline: none;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.stat-card h3 {
    font-size: 14px;
    color: #777;
    margin-bottom: 8px;
}

.stat-card strong {
    font-size: 28px;
}

/* STUDENT LIST */
.student-list {
    display: grid;
    gap: 15px;
}

.student-card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.student-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
}

.student-name {
    font-size: 19px;
    font-weight: bold;
}

.student-info {
    color: #666;
    font-size: 14px;
    margin-top: 7px;
    line-height: 1.7;
}

.status {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status.active {
    background: #dcfce7;
    color: #15803d;
}

.status.inactive {
    background: #fee2e2;
    color: #b91c1c;
}

.student-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.action-btn {
    border: none;
    padding: 9px 13px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}

.attendance-btn {
    background: #111;
    color: white;
}

.active-btn {
    background: #16a34a;
    color: white;
}

.inactive-btn {
    background: #dc2626;
    color: white;
}
.profile-btn {
    background: #2563eb;
    color: white;
}

.profile-btn:hover {
    background: #1d4ed8;
}

/* EMPTY */
.empty {
    background: white;
    text-align: center;
    padding: 50px 20px;
    border-radius: 12px;
    color: #777;
}

/* MODAL BACKGROUND */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

/* MODAL */
.modal-box {
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 16px;
    padding: 25px;
    position: relative;
    box-shadow: 0 15px 50px rgba(0,0,0,0.25);
}

.modal-box h2 {
    margin-bottom: 20px;
}

.close-btn {
    position: absolute;
    right: 18px;
    top: 12px;
    font-size: 28px;
    cursor: pointer;
    color: #666;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 6px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d5d5d5;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

.save-btn {
    width: 100%;
    border: none;
    background: #d92626;
    color: white;
    padding: 13px;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.save-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* TOAST */
.toast {
    display: none;
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #15803d;
    color: white;
    padding: 14px 18px;
    border-radius: 9px;
    z-index: 10000;
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 650px) {

    .header {
        padding: 15px;
    }

    .header h1 {
        font-size: 18px;
    }

    .container {
        width: 94%;
        margin: 18px auto;
    }

    .top-bar {
        align-items: stretch;
        flex-direction: column;
    }

    .top-bar h2 {
        font-size: 21px;
    }

    .add-btn {
        width: 100%;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .student-top {
        flex-direction: column;
    }

    .modal {
        padding: 10px;
    }

    .modal-box {
        max-height: 94vh;
        padding: 20px;
        border-radius: 14px;
    }

    .toast {
        left: 15px;
        right: 15px;
        bottom: 15px;
        text-align: center;
    }
}
</style>
</head>

<body>

<header class="header">
    <div>
        <h1>🥋 Bindass Karate Do Academy</h1>
        <p>Student Management</p>
    </div>
</header>

<main class="container">

    <div class="top-bar">
        <h2>Students</h2>

        <button class="add-btn" id="addStudentBtn">
            + Add Student
        </button>
    </div>

    <input
        type="text"
        id="searchStudent"
        class="search-box"
        placeholder="Search student by name or phone..."
    >

    <div class="stats">

        <div class="stat-card">
            <h3>Total Students</h3>
            <strong id="totalStudents">0</strong>
        </div>

        <div class="stat-card">
            <h3>Active Students</h3>
            <strong id="activeStudents">0</strong>
        </div>

        <div class="stat-card">
            <h3>Inactive Students</h3>
            <strong id="inactiveStudents">0</strong>
        </div>

    </div>

    <div id="studentList" class="student-list">
        <div class="empty">
            Loading students...
        </div>
    </div>

</main>


<!-- ADD STUDENT MODAL -->

<div class="modal" id="studentModal">

    <div class="modal-box">

        <span class="close-btn" id="closeModal">&times;</span>

        <h2>Add New Student</h2>

        <form id="studentForm">

            <div class="form-group">
                <label>Student Name *</label>
                <input
                    type="text"
                    id="studentName"
                    required
                    placeholder="Enter student name"
                >
            </div>

            <div class="form-group">
                <label>Date of Birth *</label>
                <input
                    type="date"
                    id="studentDOB"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone Number *</label>
                <input
                    type="tel"
                    id="studentPhone"
                    required
                    placeholder="Enter phone number"
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Enter email"
                >
            </div>

            <div class="form-group">
                <label>Joining Date *</label>
                <input
                    type="date"
                    id="joiningDate"
                    required
                >
            </div>

            <div class="form-group">
    <label>Monthly Fee (₹)</label>
    <input
        type="number"
        id="monthlyFee"
        min="0"
        placeholder="Enter monthly fee"
    >
</div>

            <div class="form-group">
                <label>Belt *</label>

                <select id="studentBelt" required>
                    <option value="">Select Belt</option>
                    <option value="White Belt">White Belt</option>
                    <option value="Yellow Belt">Yellow Belt</option>
                    <option value="Orange Belt">Orange Belt</option>
                    <option value="Green Belt">Green Belt</option>
                    <option value="Blue Belt">Blue Belt</option>
                    <option value="Purple Belt">Purple Belt</option>
                    <option value="Brown Belt">Brown Belt</option>
                    <option value="Black Belt">Black Belt</option>
                </select>
            </div>

            <div class="form-group">
                <label>Status *</label>

                <select id="studentStatus" required>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>

            <button
                type="submit"
                class="save-btn"
                id="saveStudentBtn"
            >
                Save Student
            </button>

        </form>

    </div>

</div>


<div class="toast" id="toast">
    Student Added Successfully!
</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    doc,
    getDoc,
    updateDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* YOUR EXISTING FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyCDpKF59MATfa-JaGF9yOBvHyi8i__3CFc",
  authDomain: "bindass-karate-do-academy.firebaseapp.com",
  projectId: "bindass-karate-do-academy",
  storageBucket: "bindass-karate-do-academy.firebasestorage.app",
  messagingSenderId: "360953215088",
  appId: "1:360953215088:web:c4399bcd991abf98229cb5",
  measurementId: "G-FWLX780V9Q"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const studentAuthApp = initializeApp(
    firebaseConfig,
    "studentAuthApp"
);

const studentAuth = getAuth(studentAuthApp);

const db = getFirestore(app);

/* ELEMENTS */

const addStudentBtn =
    document.getElementById("addStudentBtn");

const studentModal =
    document.getElementById("studentModal");

const closeModal =
    document.getElementById("closeModal");

const studentForm =
    document.getElementById("studentForm");

const studentList =
    document.getElementById("studentList");

const searchStudent =
    document.getElementById("searchStudent");

const totalStudents =
    document.getElementById("totalStudents");

const activeStudents =
    document.getElementById("activeStudents");

const inactiveStudents =
    document.getElementById("inactiveStudents");

const saveStudentBtn =
    document.getElementById("saveStudentBtn");

const toast =
    document.getElementById("toast");


let allStudents = [];
function normalizePhone(phone) {
    return String(phone || "")
        .replace(/\D/g, "")
        .slice(-10);
}

function generateStudentPassword() {
    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

    let password = "";

    for (let i = 0; i < 8; i++) {
        password += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    return password;
}

function studentLoginEmail(phone) {
    return `${normalizePhone(phone)}@student.bindass.local`;
}


/* OPEN MODAL */

addStudentBtn.addEventListener("click", () => {

    studentModal.style.display = "flex";

});


/* CLOSE MODAL */

closeModal.addEventListener("click", () => {

    studentModal.style.display = "none";

});


/* CLOSE WHEN CLICKING OUTSIDE */

studentModal.addEventListener("click", (event) => {

    if (event.target === studentModal) {
        studentModal.style.display = "none";
    }

});


/* SAVE STUDENT */

studentForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    saveStudentBtn.disabled = true;
    saveStudentBtn.textContent = "Saving...";

    try {

        const student = {

            name: document
                .getElementById("studentName")
                .value.trim(),

            dob: document
                .getElementById("studentDOB")
                .value,

            phone: document
                .getElementById("studentPhone")
                .value.trim(),

            email: document
                .getElementById("studentEmail")
                .value.trim(),

            joiningDate: document
                .getElementById("joiningDate")
                .value,

                monthlyFee: Number(
    document.getElementById("monthlyFee").value
) || 0,

            belt: document
                .getElementById("studentBelt")
                .value,

            status: document
                .getElementById("studentStatus")
                .value,

            attendance: {},

            createdAt: new Date().toISOString()

        };


        /* CREATE LOGIN ACCOUNT FOR NEW STUDENT */

        let loginAccount = null;

        if (!window.editingStudentId) {

            const cleanPhone =
                normalizePhone(student.phone);

            const existingPhone =
                allStudents.find(
                    existingStudent =>
                        normalizePhone(existingStudent.phone) === cleanPhone
                );

            if (existingPhone) {

                throw new Error(
                    "This phone number is already registered."
                );

            }

            const loginEmail =
                studentLoginEmail(cleanPhone);

            const password =
                generateStudentPassword();

            const userCredential =
                await createUserWithEmailAndPassword(
                    studentAuth,
                    loginEmail,
                    password
                );

            loginAccount = {
                uid: userCredential.user.uid,
                email: loginEmail,
                password: password
            };

        }


        if (window.editingStudentId) {

    await updateDoc(
        doc(db, "students", window.editingStudentId),
        student
    );

    window.editingStudentId = null;

    showToast("Student Updated Successfully!");

} else {

    const studentData = {
        ...student,
        loginUid: loginAccount.uid,
        loginEmail: loginAccount.email
    };

    await addDoc(
        collection(db, "students"),
        studentData
    );

    alert(
        "Student account created successfully!\n\n" +
        "Phone: " + student.phone + "\n" +
        "Password: " + loginAccount.password + "\n\n" +
        "Give these login details to the student."
    );

    showToast("Student Added Successfully!");
}

        

    } catch (error) {

        console.error(error);

        alert(
            "Unable to save student.\n\n" +
            error.message
        );

    }

    saveStudentBtn.disabled = false;
    saveStudentBtn.textContent = "Save Student";

});


/* LOAD STUDENTS */

onSnapshot(
    collection(db, "students"),
    (snapshot) => {

        allStudents = [];

        snapshot.forEach((documentSnapshot) => {

            allStudents.push({

                id: documentSnapshot.id,

                ...documentSnapshot.data()

            });

        });

        renderStudents();

    },
    (error) => {

        console.error(error);

        studentList.innerHTML = `
            <div class="empty">
                Unable to load students.
            </div>
        `;

    }
);


/* RENDER STUDENTS */

function renderStudents() {

    const search =
        searchStudent.value
            .toLowerCase()
            .trim();


    const filtered =
        allStudents.filter(student => {

            const name =
                (student.name || "")
                .toLowerCase();

            const phone =
                (student.phone || "")
                .toLowerCase();

            return (
                name.includes(search) ||
                phone.includes(search)
            );

        });


    totalStudents.textContent =
        allStudents.length;

    activeStudents.textContent =
        allStudents.filter(
            student => student.status === "Active"
        ).length;

    inactiveStudents.textContent =
        allStudents.filter(
            student => student.status === "Inactive"
        ).length;


    if (filtered.length === 0) {

        studentList.innerHTML = `
            <div class="empty">
                No students found.
            </div>
        `;

        return;
    }


    studentList.innerHTML = filtered.map(student => `

        <div class="student-card">

            <div class="student-top">

                <div>

                    <div class="student-name">
                        ${escapeHTML(student.name || "Unnamed Student")}
                    </div>

                    <div class="student-info">

                        📞 ${escapeHTML(student.phone || "No phone")}<br>

                        🎂 DOB:
                        ${escapeHTML(student.dob || "-")}<br>

                        🥋 Belt:
                        ${escapeHTML(student.belt || "-")}<br>

                        📅 Joined:
                        ${escapeHTML(student.joiningDate || "-")}

                    </div>

                </div>

                <span class="status ${
                    student.status === "Active"
                        ? "active"
                        : "inactive"
                }">

                    ${escapeHTML(student.status || "Active")}

                </span>

            </div>


            <div class="student-actions">

    <button
        class="action-btn attendance-btn"
        onclick="window.location.href='attendance.html'"
    >
        Attendance
    </button>

    <button
        class="action-btn inactive-btn"
        onclick="changeStatus('${student.id}', 'Inactive')"
    >
        Set Inactive
    </button>

    <button
        class="action-btn active-btn"
        onclick="changeStatus('${student.id}', 'Active')"
    >
        Set Active
    </button>

    <button
        class="action-btn edit-btn"
        onclick="editStudent('${student.id}')"
    >
        Edit
    </button>

    <button
        class="action-btn profile-btn"
        onclick="window.location.href='student-profile.html?id=${student.id}'"
    >
        View Profile
    </button>

    <button
        class="action-btn delete-btn"
        onclick="deleteStudent('${student.id}', '${student.name.replace(/'/g, "\\'")}')"
    >
        Delete
    </button>

</div>
</div>
            </div>
            </div>

    `).join("");

}


/* SEARCH */

searchStudent.addEventListener(
    "input",
    renderStudents
);


/* CHANGE STATUS */
// EDIT STUDENT
window.editStudent = async function(id) {
    try {
        const studentRef = doc(db, "students", id);
        const studentSnap = await getDoc(studentRef);

        if (!studentSnap.exists()) {
            alert("Student not found.");
            return;
        }

        const student = studentSnap.data();

        window.editingStudentId = id;

        document.getElementById("studentName").value = student.name || "";
        document.getElementById("studentDOB").value = student.dob || "";
        document.getElementById("studentEmail").value = student.email || "";
        document.getElementById("studentPhone").value = student.phone || "";
        document.getElementById("studentBelt").value = student.belt || "";
        document.getElementById("joiningDate").value = student.joiningDate || "";
        document.getElementById("monthlyFee").value =
    student.monthlyFee ?? "";
        document.getElementById("studentStatus").value = student.status || "Active";

        studentModal.style.display = "flex";

    } catch (error) {
        console.error(error);
        alert("Unable to load student for editing.\n\n" + error.message);
    }
};
window.changeStatus = async function(id, status) {

    try {

        await updateDoc(
            doc(db, "students", id),
            {
                status: status
            }
        );

        showToast(
            "Student status updated!"
        );

    } catch (error) {

        console.error(error);

        alert(
            "Could not update status.\n\n" +
            error.message
        );

    }

};


/* ATTENDANCE */

window.viewAttendance = function(id) {

    const student =
        allStudents.find(
            item => item.id === id
        );

    if (!student) return;

    alert(
        "Attendance section for " +
        student.name +
        " will be connected here."
    );

};


/* TOAST */

function showToast(message) {

    toast.textContent = message;

    toast.style.display = "block";

    setTimeout(() => {

        toast.style.display = "none";

    }, 2500);

}

window.deleteStudent = async function(studentId, studentName) {
    
    const confirmDelete = confirm(
        `Are you sure you want to delete ${studentName}?\n\nThis action cannot be undone.`
    );

    if (!confirmDelete) {
        return;
    }

    try {

        await deleteDoc(
            doc(db, "students", studentId)
        );

        showToast("Student Deleted Successfully!");

    } catch (error) {

        console.error(error);

        alert("Unable to delete student. Please try again.");

    }

}


/* SECURITY AGAINST HTML INJECTION */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
