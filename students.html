<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | Bindass Karate Do Academy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f5f7;
            color: #222;
            padding: 25px;
        }

        .header {
            background: #111;
            color: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 6px;
        }

        .header p {
            color: #bbb;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .add-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
        }

        .stat p {
            color: #777;
            font-size: 14px;
        }

        .stat h2 {
            margin-top: 8px;
            font-size: 28px;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px #ddd;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f7f7f7;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #e8f5e9;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #111;
            font-weight: bold;
        }

        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .top {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .add-btn {
                width: 100%;
            }
            /* ADD STUDENT MODAL - FINAL */

#studentModal {
    display: none !important;
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background: rgba(0, 0, 0, 0.65) !important;
    z-index: 99999 !important;
    justify-content: center !important;
    align-items: center !important;
    padding: 20px !important;
    box-sizing: border-box !important;
}

#studentModal .modal-content {
    background: #ffffff !important;
    width: 100% !important;
    max-width: 500px !important;
    max-height: 90vh !important;
    overflow-y: auto !important;
    padding: 30px !important;
    border-radius: 16px !important;
    position: relative !important;
    box-sizing: border-box !important;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3) !important;
}

#studentModal .modal-content input,
#studentModal .modal-content select {
    width: 100% !important;
    padding: 12px !important;
    margin: 8px 0 15px !important;
    border: 1px solid #ccc !important;
    border-radius: 8px !important;
    box-sizing: border-box !important;
    font-size: 15px !important;
}

#studentModal .modal-content label {
    display: block !important;
    font-weight: 600 !important;
    margin-top: 5px !important;
}

#studentModal .close {
    position: absolute !important;
    right: 20px !important;
    top: 12px !important;
    font-size: 28px !important;
    cursor: pointer !important;
}

#studentModal .save-btn {
    width: 100% !important;
    padding: 13px !important;
    border: none !important;
    border-radius: 8px !important;
    background: #111827 !important;
    color: white !important;
    font-size: 16px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
}

.save-btn:hover {
    opacity: 0.9;
}
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>👥 Student Management</h1>
        <p>Bindass Karate Do Academy</p>
    </div>

    <div class="top">

        <input
            type="text"
            class="search"
            id="searchStudent"
            placeholder="🔍 Search student by name..."
        >

        <button class="add-btn" id="addStudentBtn">
    + Add Student
</button>
    </div>

    <div class="stats">

        <div class="stat">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="stat">
            <p>Active Students</p>
            <h2 id="activeStudents">0</h2>
        </div>

        <div class="stat">
            <p>Inactive Students</p>
            <h2 id="inactiveStudents">0</h2>
        </div>

    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Belt</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="studentList">

                <tr>
                    <td>Test Student</td>
                    <td>test@example.com</td>
                    <td>9999999999</td>
                    <td>White Belt</td>
                    <td>
                        <span class="status">Active</span>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <a href="admin.html" class="back">
        ← Back to Admin Dashboard
    </a>
    
</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyCDpKF59MATfa-JaGF9yOBvHyi8i__3CFc",
    authDomain: "bindass-karate-do-academy.firebaseapp.com",
    projectId: "bindass-karate-do-academy",
    storageBucket: "bindass-karate-do-academy.firebasestorage.app",
    messagingSenderId: "360953215088",
    appId: "1:360953215088:web:c4399bcd991abf98229cb5",
    measurementId: "G-FWLX780V9Q"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const auth = getAuth(app);


async function loadStudents() {

    const studentList = document.getElementById("studentList");

    try {

        const snapshot = await getDocs(
            collection(db, "Students")
        );

        studentList.innerHTML = "";

        let total = 0;
        let active = 0;
        let inactive = 0;


        snapshot.forEach((doc) => {

            const student = doc.data();

            total++;

            if (student.status === "active") {
                active++;
            } else {
                inactive++;
            }


            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${student.name || "-"}</td>
                <td>${student.email || "-"}</td>
                <td>${student.phone || "-"}</td>
                <td>${student.belt || "-"}</td>
                <td>
                    <span class="status">
                        ${student.status || "-"}
                    </span>
                </td>
            `;

            studentList.appendChild(row);

        });


        document.getElementById("totalStudents").textContent = total;

        document.getElementById("activeStudents").textContent = active;

        document.getElementById("inactiveStudents").textContent = inactive;


    } catch (error) {

        console.error("Student loading error:", error);

        studentList.innerHTML = `
            <tr>
                <td colspan="5">
                    Error loading students.
                </td>
            </tr>
        `;

    }

}


onAuthStateChanged(auth, (user) => {

    if (user) {

        loadStudents();

    } else {

        console.log("NO USER LOGGED IN");

    }

});
const addStudentBtn = document.getElementById("addStudentBtn");
const studentModal = document.getElementById("studentModal");
const closeModal = document.getElementById("closeModal");

addStudentBtn.addEventListener("click", () => {
    studentModal.style.display = "flex";

    const modalContent = studentModal.querySelector(".modal-content");

    modalContent.style.position = "fixed";
    modalContent.style.top = "50%";
    modalContent.style.left = "50%";
    modalContent.style.transform = "translate(-50%, -50%)";
    modalContent.style.width = "90%";
    modalContent.style.maxWidth = "500px";
    modalContent.style.maxHeight = "90vh";
    modalContent.style.overflowY = "auto";
    modalContent.style.background = "white";
    modalContent.style.padding = "30px";
    modalContent.style.borderRadius = "16px";
    modalContent.style.boxSizing = "border-box";
});

closeModal.addEventListener("click", () => {
    studentModal.style.display = "none";
});
</script>
<div id="studentModal" class="modal" style="display:none; position:fixed; inset:0; width:100%; height:100%; background:rgba(0,0,0,0.65); z-index:99999; justify-content:center; align-items:center; padding:20px; box-sizing:border-box;"></div>
    <div class="modal-content" style="background:white; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; padding:30px; border-radius:16px; box-sizing:border-box; position:relative; box-shadow:0 15px 40px rgba(0,0,0,0.3);"></div>
        <span class="close" id="closeModal">&times;</span>

        <h2>Add New Student</h2>

        <input type="text" id="studentName" placeholder="Student Name">

        <label>Date of Birth</label>
        <input type="date" id="studentDOB">

        <input type="email" id="studentEmail" placeholder="Email">

        <input type="tel" id="studentPhone" placeholder="Phone Number">

        <select id="studentBelt">
            <option value="White Belt">White Belt</option>
            <option value="Yellow Belt">Yellow Belt</option>
            <option value="Orange Belt">Orange Belt</option>
            <option value="Green Belt">Green Belt</option>
            <option value="Blue Belt">Blue Belt</option>
            <option value="Blue Belt 1">Blue Belt 1</option>
            <option value="Purple Belt">Purple Belt</option>
            <option value="Brown 3RD KYU">Brown 3RD KYU</option>
            <option value="Brown 2ND KYU">Brown 2ND KYU</option>
            <option value="Brown 1ST KYU">Brown 1ST KYU</option>
            <option value="Black Belt">Black Belt</option>
        </select>

        <label>Joining Date</label>
        <input type="date" id="joiningDate">

        <select id="studentStatus">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>

        <button id="saveStudentBtn" class="save-btn">
            Save Student
        </button>

        <p id="studentMessage"></p>
    </div>
</body>
</html>
