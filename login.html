<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bindass Karate Do Academy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        .login-box img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="images/bindasslogo.jpeg" alt="Bindass Karate Do Academy">

        <h1>Bindass Karate Do Academy</h1>
        <p class="subtitle">Student & Admin Login</p>

        <select id="loginRole">
            <option value="student">Student Login</option>
            <option value="admin">Admin Login</option>
        </select>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button id="loginBtn">Login</button>

        <p id="message"></p>

        <a href="index.html" class="back">← Back to Website</a>

    </div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

        import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        // Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
 const firebaseConfig = {
    apiKey: "AIzaSyCDpKF59MATfa-JaGF9yOBvHyi8i__3CFc",
    authDomain: "bindass-karate-do-academy.firebaseapp.com",
    projectId: "bindass-karate-do-academy",
    storageBucket: "bindass-karate-do-academy.firebasestorage.app",
    messagingSenderId: "360953215088",
    appId: "1:360953215088:web:c4399bcd991abf98229cb5",
    measurementId: "G-FWLX780V9Q"
  };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);


        document.getElementById("loginBtn").onclick = async function () {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("loginRole").value;
            const message = document.getElementById("message");

            if (!email || !password) {
                message.textContent = "Please enter email and password.";
                return;
            }

            message.textContent = "Logging in...";

            try {

                await setPersistence(auth, browserLocalPersistence);

await signInWithEmailAndPassword(auth, email, password);

                message.textContent = "Login successful!";

                if (role === "admin") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "student.html";
                }

            } catch (error) {

                message.textContent = "Login failed. Please check your email and password.";

                console.error(error);

            }

        };

    </script>

</body>
</html>
