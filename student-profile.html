<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Profile | Bindass Karate Do Academy</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
button,input{font:inherit}
button{cursor:pointer}

.topbar{
background:linear-gradient(135deg,#080b12,#172033);
color:white;padding:14px 20px;
display:flex;justify-content:space-between;align-items:center;
position:sticky;top:0;z-index:10
}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:contain;background:white}
.brand b{font-size:16px}
.brand small{display:block;color:#9ca3af;margin-top:3px}
.actions{display:flex;gap:7px}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:700}
.btn-dark{background:#374151;color:white}
.btn-red{background:#dc2626;color:white}

.container{width:min(1150px,calc(100% - 24px));margin:24px auto 50px}

.hero{
background:linear-gradient(135deg,#080b12,#1f2937);
color:white;border-radius:20px;padding:25px;margin-bottom:20px;
box-shadow:0 12px 30px #0002
}
.hero-main{display:flex;align-items:center;gap:18px}
.avatar{width:90px;height:90px;padding:6px;background:white;border-radius:20px}
.avatar img{width:100%;height:100%;object-fit:contain}
.eyebrow{font-size:10px;color:#9ca3af;letter-spacing:1.5px;font-weight:bold}
.hero h1{font-size:34px;margin:5px 0}
.id{font-size:12px;color:#cbd5e1}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.badge{padding:6px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.belt{background:#f59e0b22;color:#fbbf24}
.active{background:#16a34a22;color:#86efac}

.hero-stats{
display:grid;grid-template-columns:repeat(3,1fr);
gap:10px;margin-top:22px
}
.hero-stat{background:#ffffff0d;padding:13px;border-radius:12px}
.hero-stat small{display:block;color:#9ca3af;font-size:10px}
.hero-stat strong{display:block;font-size:20px;margin-top:4px}
.card{
background:white;border:1px solid #e5e7eb;border-radius:16px;
padding:20px;box-shadow:0 6px 20px #0000000a
}
.grid{
display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
gap:18px
}
.full{grid-column:1/-1}

.card-head{
display:flex;align-items:center;gap:10px;margin-bottom:16px
}
.icon{
width:38px;height:38px;border-radius:10px;
background:#f1f5f9;display:grid;place-items:center
}
.card h2{font-size:17px}
.sub{font-size:11px;color:#6b7280;margin-top:2px}

.attendance{
display:grid;grid-template-columns:repeat(3,1fr);gap:10px
}
.att-box{
border:1px solid #e5e7eb;border-radius:13px;
padding:15px;text-align:center
}
.att-box small{display:block;color:#6b7280;font-size:10px}
.percent{font-size:25px;font-weight:900;margin:6px 0}
.progress{height:7px;background:#e5e7eb;border-radius:20px;overflow:hidden}
.progress i{
display:block;height:100%;width:0;
background:linear-gradient(90deg,#dc2626,#ef4444)
}
.count{font-size:10px;color:#6b7280;margin-top:6px}

.details{
display:grid;grid-template-columns:repeat(2,1fr);
border:1px solid #e5e7eb;border-radius:12px;overflow:hidden
}
.detail{padding:13px;border:1px solid #e5e7eb}
.detail small{
display:block;color:#6b7280;font-size:9px;
text-transform:uppercase;font-weight:bold;margin-bottom:4px
}
.detail b{font-size:13px;word-break:break-word}

.info{
background:#f8fafc;border:1px solid #e5e7eb;
border-radius:12px;padding:14px;margin-bottom:9px
}
.info:last-child{margin-bottom:0}
.info b{font-size:13px}
.info p{font-size:12px;color:#6b7280;margin-top:5px;white-space:pre-line}

.fees{
display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
margin-bottom:16px
}
.fee{
padding:15px;border:1px solid #e5e7eb;
border-radius:12px;background:#fafafa
}
.fee small{display:block;color:#6b7280;font-size:9px;font-weight:bold}
.fee strong{display:block;font-size:21px;margin-top:5px}
.pending{color:#dc2626}
.paid{color:#16a34a}

.table-wrap{overflow-x:auto;border:1px solid #e5e7eb;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb;font-size:11px}
th{background:#f8fafc;color:#6b7280;font-size:9px;text-transform:uppercase}
.status{padding:5px 8px;border-radius:15px;font-weight:bold;font-size:9px}
.status-paid{background:#dcfce7;color:#166534}
.status-pending{background:#fef3c7;color:#92400e}

.primary{
background:#dc2626;color:white;border:0;
border-radius:9px;padding:10px 15px;font-weight:bold
}

.loading{
height:250px;display:grid;place-items:center;color:#6b7280
}
@media(max-width:750px){
.grid{grid-template-columns:1fr}
.full{grid-column:auto}
.hero-main{align-items:flex-start}
.hero h1{font-size:27px}
.hero-stats{grid-template-columns:1fr}
.attendance{grid-template-columns:1fr}
.fees{grid-template-columns:1fr}
}

@media(max-width:500px){
.topbar{padding:11px}
.brand small{display:none}
.brand b{font-size:13px}
.btn{padding:8px;font-size:11px}
.container{width:calc(100% - 14px);margin-top:14px}
.hero{padding:18px}
.avatar{width:70px;height:70px}
.hero h1{font-size:24px}
.card{padding:15px}
.details{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <img src="images/bindasslogo.jpeg" alt="BKD">
        <div>
            <b>Bindass Karate Do Academy</b>
            <small>Student Management System</small>
        </div>
    </div>

    <div class="actions">
        <button id="backToStudentsBtn" class="btn btn-dark">
            ← Students
        </button>

        <button id="logoutBtn" class="btn btn-red">
            🚪 Logout
        </button>
    </div>
</header>

<main class="container">

    <div id="profileContent">
        <div class="loading">
            Loading student profile...
        </div>
    </div>

    <section id="changePasswordSection"
             class="card"
             style="display:none;margin-top:18px">

        <div class="card-head">
            <div class="icon">🔐</div>
            <div>
                <h2>Change Password</h2>
                <div class="sub">Update student login password</div>
            </div>
        </div>

        <form id="changePasswordForm">

            <div style="display:grid;gap:10px">

                <input id="newPassword"
                       type="password"
                       minlength="6"
                       placeholder="New password"
                       required
                       style="padding:11px;border:1px solid #ddd;border-radius:9px">

                <input id="confirmPassword"
                       type="password"
                       minlength="6"
                       placeholder="Confirm password"
                       required
                       style="padding:11px;border:1px solid #ddd;border-radius:9px">

                <button class="primary" type="submit">
                    🔑 Update Password
                </button>

            </div>

            <div id="passwordMessage"></div>
        </form>
    </section>

</main>
<!-- PAYMENT MODAL -->
<div id="paymentModal"
     style="display:none;position:fixed;inset:0;background:#0009;
     z-index:100;align-items:center;justify-content:center;padding:15px">

    <div class="card" style="width:min(450px,100%)">

        <div class="card-head">
            <div>
                <h2>💳 Make Payment</h2>
                <div class="sub">Pay academy fees through UPI</div>
            </div>

            <button class="btn"
                    onclick="closePaymentModal()">✕</button>
        </div>

        <div class="info">
            <b>Academy UPI ID</b>
            <p>bindasskarate786@okhdfcbank</p>
        </div>

        <input id="paymentAmount"
               type="number"
               min="1"
               placeholder="Payment amount"
               style="width:100%;padding:11px;border:1px solid #ddd;border-radius:9px">

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px">
            <button class="btn" onclick="closePaymentModal()">
                Cancel
            </button>

            <button class="primary" onclick="payViaUPI()">
                Pay via UPI
            </button>
        </div>

    </div>
</div>


<!-- UTR MODAL -->
<div id="paymentReferenceModal"
     style="display:none;position:fixed;inset:0;background:#0009;
     z-index:101;align-items:center;justify-content:center;padding:15px">

    <div class="card" style="width:min(450px,100%)">

        <div class="card-head">
            <div>
                <h2>🧾 Payment Reference</h2>
                <div class="sub">Submit your UTR / transaction number</div>
            </div>

            <button class="btn"
                    onclick="closePaymentReferenceModal()">✕</button>
        </div>

        <input id="paymentReference"
               type="text"
               placeholder="Enter UTR / transaction reference"
               style="width:100%;padding:11px;border:1px solid #ddd;border-radius:9px">

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px">

            <button class="btn"
                    onclick="closePaymentReferenceModal()">
                Cancel
            </button>

            <button class="primary"
                    onclick="submitPaymentReference()">
                Submit
            </button>

        </div>

    </div>
</div>


<script type="module">
    import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCDpKF59MATfa-JaGF9yOBvHyi8i__3CFc",
  authDomain: "bindass-karate-do-academy.firebaseapp.com",
  projectId: "bindass-karate-do-academy",
  storageBucket: "bindass-karate-do-academy.firebasestorage.app",
  messagingSenderId: "360953215088",
  appId: "1:360953215088:web:c4399bcd991abf98229cb5",
  measurementId: "G-FWLX780V9Q"
};



const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let studentId = null;
let studentData = null;
let studentMode = false;
let pendingFeeAmount = 0;


const $ = id => document.getElementById(id);


function esc(value) {
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function money(value) {
    return "₹" + Number(value || 0).toLocaleString("en-IN");
}


function dateFormat(value) {
    if (!value) return "-";

    const d = new Date(value);

    if (isNaN(d)) return esc(value);

    return d.toLocaleDateString("en-IN", {
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}


function percent(present,total) {
    return total
        ? Math.round((present / total) * 100)
        : 0;
}


onAuthStateChanged(auth, async user => {

    try {

        if (!user) {
            location.replace("login.html");
            return;
        }

        const role = localStorage.getItem("bkdLoginRole");

        studentMode = role === "student";

        if (studentMode) {

            $("backToStudentsBtn").style.display = "none";

            const snap = await getDocs(
                collection(db, "students")
            );

            snap.forEach(d => {

                const s = d.data();

                if (s.loginUid === user.uid) {
                    studentId = d.id;
                    studentData = s;
                }

            });

        } else {

            const params = new URLSearchParams(location.search);

            studentId =
                params.get("id") ||
                params.get("studentId") ||
                localStorage.getItem("selectedStudentId");

            if (!studentId) {

                $("profileContent").innerHTML = `
                    <div class="card"
                         style="padding:25px;text-align:center">

                        <h2>Student ID not found</h2>

                        <p style="color:#6b7280;margin-top:8px">
                            Please open a student profile from
                            the Students page.
                        </p>

                    </div>
                `;

                return;
            }
        }

        if (!studentData && studentId) {

            const snap = await getDoc(
                doc(db, "students", studentId)
            );

            if (snap.exists()) {
                studentData = snap.data();
            }
        }

        if (!studentData) {

            $("profileContent").innerHTML = `
                <div class="card"
                     style="padding:25px;text-align:center">

                    <h2>Student profile not found</h2>

                    <p style="color:#6b7280;margin-top:8px">
                        No student record was found.
                    </p>

                </div>
            `;

            return;
        }

        if (!studentMode) {
            $("changePasswordSection").style.display = "block";
        }

        await loadStudentProfile();

    } catch (error) {

        console.error("Student profile loading error:", error);

        $("profileContent").innerHTML = `
            <div class="card"
                 style="padding:25px;text-align:center">

                <h2>Unable to load profile</h2>

                <p style="color:#dc2626;margin-top:10px">
                    ${error.message}
                </p>

            </div>
        `;
    }

});


async function loadStudentProfile() {

    const s = studentData;

    let total = 0;
    let present = 0;

    let monthTotal = 0;
    let monthPresent = 0;

    let yearTotal = 0;
    let yearPresent = 0;

    const now = new Date();
    const thisMonth = now.getMonth();
    const thisYear = now.getFullYear();

    const attendanceSnap =
        await getDocs(collection(db,"attendance"));

    attendanceSnap.forEach(d => {

        const a = d.data();

        if (a.studentId !== studentId) return;

        total++;

        if (
            a.status === "Present" ||
            a.present === true
        ) {
            present++;
        }

        const rawDate =
            a.date || a.attendanceDate;

        if (!rawDate) return;

        const date = new Date(rawDate);

        if (
            date.getMonth() === thisMonth &&
            date.getFullYear() === thisYear
        ) {
            monthTotal++;

            if (
                a.status === "Present" ||
                a.present === true
            ) {
                monthPresent++;
            }
        }

        if (date.getFullYear() === thisYear) {

            yearTotal++;

            if (
                a.status === "Present" ||
                a.present === true
            ) {
                yearPresent++;
            }
        }
    });


    const overall = percent(present,total);
    const monthly = percent(monthPresent,monthTotal);
    const yearly = percent(yearPresent,yearTotal);


    let payments = [];

    const feeSnap =
        await getDocs(collection(db,"fees"));

    feeSnap.forEach(d => {

        const f = d.data();

        if (f.studentId === studentId) {
            payments.push({
                id:d.id,
                ...f
            });
        }
    });


    let paid = 0;

    payments.forEach(f => {
        if (
            String(f.status || "").toLowerCase() === "paid"
        ) {
            paid += Number(f.amount || 0);
        }
    });


    const monthlyFee =
        Number(s.monthlyFee || 0);

    const pending =
        Math.max(
            0,
            Number(s.pendingFee || 0)
        );

    pendingFeeAmount = pending;


    const achievements =
        s.achievements ||
        s.achievement ||
        "No achievements added yet.";

    const notices =
        s.notice ||
        s.notices ||
        "No recent notices.";


    $("profileContent").innerHTML = `

        <section class="hero">

            <div class="hero-main">

                <div class="avatar">
                    <img src="images/bindasslogo.jpeg"
                         alt="BKD">
                </div>

                <div>

                    <div class="eyebrow">
                        BKD STUDENT PROFILE
                    </div>

                    <h1>${esc(s.name || "Student")}</h1>

                    <div class="id">
                        Student ID: ${esc(studentId)}
                    </div>

                    <div class="badges">

                        <span class="badge belt">
                            🥋 ${esc(s.belt || "Belt Not Assigned")}
                        </span>

                        <span class="badge active">
                            ● ${esc(s.status || "Active")}
                        </span>

                    </div>

                </div>

            </div>


            <div class="hero-stats">

                <div class="hero-stat">
                    <small>Monthly Attendance</small>
                    <strong>${monthly}%</strong>
                </div>

                <div class="hero-stat">
                    <small>Pending Fees</small>
                    <strong>${money(pending)}</strong>
                </div>

                <div class="hero-stat">
                    <small>Joining Date</small>
                    <strong style="font-size:14px">
                        ${dateFormat(s.joiningDate)}
                    </strong>
                </div>

            </div>

        </section>


        <div class="grid">

            <section class="card">

                <div class="card-head">
                    <div class="icon">📊</div>
                    <div>
                        <h2>Attendance</h2>
                        <div class="sub">
                            Attendance performance
                        </div>
                    </div>
                </div>

                <div class="attendance">

                    ${attendanceBox(
                        "This Month",
                        monthly,
                        monthPresent,
                        monthTotal
                    )}

                    ${attendanceBox(
                        "This Year",
                        yearly,
                        yearPresent,
                        yearTotal
                    )}

                    ${attendanceBox(
                        "Overall",
                        overall,
                        present,
                        total
                    )}

                </div>

            </section>


            <section class="card">

                <div class="card-head">
                    <div class="icon">👤</div>
                    <div>
                        <h2>Student Details</h2>
                        <div class="sub">
                            Personal information
                        </div>
                    </div>
                </div>

                <div class="details">

                    ${detail("Full Name",s.name)}
                    ${detail("Date of Birth",dateFormat(s.dob))}
                    ${detail("Phone",s.phone)}
                    ${detail("Email",s.email)}
                    ${detail("Belt",s.belt)}
                    ${detail("Joining Date",dateFormat(s.joiningDate))}
                    ${detail("Guardian",s.guardianName)}
                    ${detail("Emergency Contact",s.emergencyContact)}

                </div>

            </section>


            <section class="card">

                <div class="card-head">
                    <div class="icon">🏆</div>
                    <div>
                        <h2>Achievements</h2>
                        <div class="sub">
                            Student achievements
                        </div>
                    </div>
                </div>

                <div class="info">
                    <p>${esc(achievements)}</p>
                </div>

            </section>


            <section class="card">

                <div class="card-head">
                    <div class="icon">📢</div>
                    <div>
                        <h2>Notices & Updates</h2>
                        <div class="sub">
                            Academy announcements
                        </div>
                    </div>
                </div>

                <div class="info">
                    <p>${esc(notices)}</p>
                </div>

            </section>


            <section class="card full">

                <div class="card-head">
                    <div class="icon">💰</div>
                    <div>
                        <h2>Fee Management</h2>
                        <div class="sub">
                            Payment summary
                        </div>
                    </div>
                </div>

                <div class="fees">

                    <div class="fee">
                        <small>Monthly Fee</small>
                        <strong>
                            ${money(monthlyFee)}
                        </strong>
                    </div>

                    <div class="fee">
                        <small>Total Paid</small>
                        <strong class="paid">
                            ${money(paid)}
                        </strong>
                    </div>

                    <div class="fee">
                        <small>Pending</small>
                        <strong class="pending"
                                id="pendingFee">
                            ${money(pending)}
                        </strong>
                    </div>

                </div>

                ${
                    pending > 0
                    ? `
                    <button
                        class="primary"
                        onclick="openPayment()">
                        💳 Pay Pending Fee
                    </button>
                    `
                    : `
                    <div class="info">
                        <b>✓ No Pending Fees</b>
                        <p>Your fee account is currently clear.</p>
                    </div>
                    `
                }

            </section>
            <section class="card full">

                <div class="card-head">
                    <div class="icon">🧾</div>
                    <div>
                        <h2>Fee History</h2>
                        <div class="sub">
                            Previous payment records
                        </div>
                    </div>
                </div>

                <div class="table-wrap">

                    <table>

                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody>

                            ${
                                payments.length
                                ? payments
                                    .sort((a,b) =>
                                        String(b.feeDate || "")
                                        .localeCompare(
                                            String(a.feeDate || "")
                                        )
                                    )
                                    .map(f => `
                                    <tr>
                                        <td>
                                            ${dateFormat(f.feeDate)}
                                        </td>

                                        <td>
                                            ${esc(f.type || "Fee")}
                                        </td>

                                        <td>
                                            ${esc(f.description || "-")}
                                        </td>

                                        <td>
                                            ${money(f.amount)}
                                        </td>

                                        <td>
                                            <span class="status ${
                                                String(f.status || "")
                                                .toLowerCase() === "paid"
                                                ? "status-paid"
                                                : "status-pending"
                                            }">
                                                ${esc(f.status || "Pending")}
                                            </span>
                                        </td>
                                    </tr>
                                    `).join("")
                                : `
                                    <tr>
                                        <td colspan="5"
                                            style="text-align:center">
                                            No fee records found.
                                        </td>
                                    </tr>
                                `
                            }

                        </tbody>

                    </table>

                </div>

            </section>

        </div>
    `;
}


function attendanceBox(label,p,t,total) {

    return `
        <div class="att-box">

            <small>${label}</small>

            <div class="percent">
                ${p}%
            </div>

            <div class="progress">
                <i style="width:${p}%"></i>
            </div>

            <div class="count">
                ${t}/${total} Present
            </div>

        </div>
    `;
}


function detail(label,value) {

    return `
        <div class="detail">
            <small>${esc(label)}</small>
            <b>${esc(value || "-")}</b>
        </div>
    `;
}


/* =========================
   PAYMENT
========================= */

window.openPayment = function() {

    $("paymentAmount").value =
        pendingFeeAmount > 0
        ? pendingFeeAmount
        : "";

    $("paymentModal").style.display = "flex";
};


window.closePaymentModal = function() {
    $("paymentModal").style.display = "none";
};


window.closePaymentReferenceModal = function() {
    $("paymentReferenceModal").style.display = "none";
};


window.payViaUPI = async function() {

    const amount =
        Number($("paymentAmount").value);

    if (!amount || amount <= 0) {
        alert("Please enter a valid amount.");
        return;
    }

    const name =
        studentData?.name || "Student";

    const upi =
        "upi://pay" +
        "?pa=bindasskarate786@okhdfcbank" +
        "&pn=" +
        encodeURIComponent("Bindass Karate Do Academy") +
        "&am=" +
        encodeURIComponent(amount) +
        "&cu=INR" +
        "&tn=" +
        encodeURIComponent(
            "Fee Payment - " + name
        );

    try {

        await addDoc(
            collection(db,"payments"),
            {
                studentId,
                studentName:name,
                amount,
                status:"Pending",
                createdAt:serverTimestamp()
            }
        );

        location.href = upi;

        setTimeout(() => {
            $("paymentModal").style.display = "none";
            $("paymentReferenceModal").style.display = "flex";
        },1500);

    } catch(error) {

        console.error(error);

        alert(
            "Unable to start payment.\n" +
            error.message
        );
    }
};


window.submitPaymentReference = async function() {

    const ref =
        $("paymentReference").value.trim();

    if (!ref) {
        alert("Please enter the UTR/reference number.");
        return;
    }

    try {

        const snap =
            await getDocs(collection(db,"payments"));

        let found = null;

        snap.forEach(d => {

            const p = d.data();

            if (
                p.studentId === studentId &&
                p.status === "Pending"
            ) {
                found = d.id;
            }
        });

        if (found) {

            await updateDoc(
                doc(db,"payments",found),
                {
                    transactionRef:ref,
                    status:"Pending Verification",
                    submittedAt:serverTimestamp()
                }
            );

        } else {

            await addDoc(
                collection(db,"payments"),
                {
                    studentId,
                    studentName:studentData?.name || "",
                    transactionRef:ref,
                    amount:Number(
                        $("paymentAmount").value || 0
                    ),
                    status:"Pending Verification",
                    submittedAt:serverTimestamp()
                }
            );
        }

        $("paymentReferenceModal").style.display =
            "none";

        $("paymentReference").value = "";

        alert(
            "Payment reference submitted successfully.\n" +
            "The academy will verify it."
        );

    } catch(error) {

        console.error(error);

        alert(
            "Unable to submit reference.\n" +
            error.message
        );
    }
};


/* =========================
   PASSWORD
========================= */

$("changePasswordForm")
.addEventListener("submit",async e => {

    e.preventDefault();

    const password =
        $("newPassword").value;

    const confirm =
        $("confirmPassword").value;

    const msg =
        $("passwordMessage");

    msg.className = "";

    if (password !== confirm) {

        msg.textContent =
            "Passwords do not match.";

        msg.style.cssText =
            "display:block;color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px;margin-top:10px";

        return;
    }

    if (password.length < 6) {

        msg.textContent =
            "Password must contain at least 6 characters.";

        return;
    }

    try {

        /*
         * Firebase client-side password changes
         * require the currently authenticated user.
         */
        const user = auth.currentUser;

        if (!user) {
            throw new Error("Please login first.");
        }

        await updatePassword(
            user,
            password
        );

        msg.textContent =
            "Password updated successfully.";

        msg.style.cssText =
            "display:block;color:#166534;background:#dcfce7;padding:10px;border-radius:8px;margin-top:10px";

        $("changePasswordForm").reset();

    } catch(error) {

        console.error(error);

        msg.textContent =
            error.message ||
            "Unable to update password.";

        msg.style.cssText =
            "display:block;color:#991b1b;background:#fee2e2;padding:10px;border-radius:8px;margin-top:10px";
    }
});
