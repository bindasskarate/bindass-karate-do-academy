<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile | Bindass Karate Do Academy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

.header {
    background: #111;
    color: white;
    padding: 20px;
}

.header h1 {
    font-size: 22px;
}

.header p {
    color: #bbb;
    margin-top: 5px;
    font-size: 13px;
}

.container {
    width: min(1100px, 94%);
    margin: 25px auto;
}

.back-btn {
    border: none;
    background: #333;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 18px;
}

.profile-header {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.profile-header h2 {
    font-size: 28px;
    margin-bottom: 8px;
}

.student-id {
    color: #777;
    font-size: 13px;
}

.status {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #dcfce7;
    color: #15803d;
    font-size: 12px;
    font-weight: bold;
}

.section {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.section h3 {
    font-size: 19px;
    margin-bottom: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

.details-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.detail {
    background: #f8fafc;
    padding: 14px;
    border-radius: 9px;
}

.detail strong {
    display: block;
    font-size: 12px;
    color: #777;
    margin-bottom: 5px;
}

.detail span {
    font-weight: bold;
}

.attendance-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.attendance-card {
    padding: 20px;
    border-radius: 12px;
    background: #f8fafc;
    text-align: center;
}

.attendance-card strong {
    display: block;
    font-size: 28px;
    margin-top: 6px;
}

.placeholder {
    color: #777;
    font-size: 14px;
    line-height: 1.6;
}

.fee-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: #f8fafc;
    padding: 18px;
    border-radius: 10px;
}

.pay-btn {
    border: none;
    background: #16a34a;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #777;
}

@media (max-width: 650px) {

    .container {
        width: 94%;
    }

    .details-grid,
    .attendance-grid {
        grid-template-columns: 1fr;
    }

    .profile-header h2 {
        font-size: 23px;
    }

    .fee-box {
        flex-direction: column;
        align-items: stretch;
    }

    .pay-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>🥋 Bindass Karate Do Academy</h1>
    <p>Student Profile</p>
</header>

<main class="container">

    <button
        class="back-btn"
        onclick="window.location.href='students.html'"
    >
        ← Back to Students
    </button>

    <div id="profile">
        <div class="loading">
            Loading student profile...
        </div>
    </div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyCDpKF59MATfa-JaGF9yOBvHyi8i__3CFc",
  authDomain: "bindass-karate-do-academy.firebaseapp.com",
  projectId: "bindass-karate-do-academy",
  storageBucket: "bindass-karate-do-academy.firebasestorage.app",
  messagingSenderId: "360953215088",
  appId: "1:360953215088:web:c4399bcd991abf98229cb5",
  measurementId: "G-FWLX780V9Q"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const profile = document.getElementById("profile");


/* GET STUDENT ID FROM URL */

const params = new URLSearchParams(window.location.search);
const studentId = params.get("id");


/* LOAD PROFILE */

async function loadStudentProfile() {

    if (!studentId) {

        profile.innerHTML = `
            <div class="section">
                Student ID not found.
            </div>
        `;

        return;
    }

    try {

        const studentRef = doc(db, "students", studentId);
        const studentSnap = await getDoc(studentRef);

        if (!studentSnap.exists()) {

            profile.innerHTML = `
                <div class="section">
                    Student not found.
                </div>
            `;

            return;
        }

        const student = studentSnap.data();
        const attendanceSnapshot = await getDocs(
    collection(db, "attendance")
);

let totalDays = 0;
let presentDays = 0;
let monthlyTotal = 0;
let monthlyPresent = 0;

const currentMonth = new Date().toISOString().slice(0, 7);
const currentYear = new Date().getFullYear().toString();

attendanceSnapshot.forEach((attendanceDoc) => {

    const date = attendanceDoc.id;
    const data = attendanceDoc.data();
    const status = data.records?.[studentId];

    if (!status) return;

    totalDays++;

    if (status === "Present") {
        presentDays++;
    }

    if (date.startsWith(currentMonth)) {

        monthlyTotal++;

        if (status === "Present") {
            monthlyPresent++;
        }
    }
});
const monthlyData = {};

attendanceSnapshot.forEach((attendanceDoc) => {

    const date = attendanceDoc.id;
    const data = attendanceDoc.data();
    const status = data.records?.[studentId];

    if (!status) return;

    const month = date.slice(0, 7);

    if (!monthlyData[month]) {
        monthlyData[month] = {
            total: 0,
            present: 0
        };
    }

    monthlyData[month].total++;

    if (status === "Present") {
        monthlyData[month].present++;
    }
});
const overallPercentage =
    totalDays > 0
        ? Math.round((presentDays / totalDays) * 100)
        : 0;

const monthlyPercentage =
    monthlyTotal > 0
        ? Math.round((monthlyPresent / monthlyTotal) * 100)
        : 0;
const monthlyAttendanceHTML =
    Object.keys(monthlyData)
        .sort()
        .map(month => {

            const data = monthlyData[month];

            const percentage =
                Math.round((data.present / data.total) * 100);

            const monthName =
                new Date(month + "-01").toLocaleString(
                    "en-US",
                    { month: "long", year: "numeric" }
                );

            return `
                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    padding:14px;
                    margin-bottom:8px;
                    background:#f8fafc;
                    border-radius:9px;
                ">
                    <strong>${monthName}</strong>

                    <span>
                        ${data.present}/${data.total}
                        &nbsp;•&nbsp;
                        <strong>${percentage}%</strong>
                    </span>
                </div>
            `;
        })
        .join("");
        profile.innerHTML = `

            <div class="profile-header">

                <h2>
                    ${escapeHTML(student.name || "Unnamed Student")}
                </h2>

                <div class="student-id">
                    Student ID: ${escapeHTML(studentId)}
                </div>

                <span class="status">
                    ${escapeHTML(student.status || "Active")}
                </span>

            </div>


            <!-- ATTENDANCE -->

            <div class="section">

                <h3>📊 Attendance</h3>

                <div class="attendance-grid">

                    <div class="attendance-card">
                        This Month
                        <strong>${monthlyPercentage}%</strong>
                    </div>

                    <div class="attendance-card">
                        This Year
                        <strong>${overallPercentage}%</strong>
                    </div>

                    <div class="attendance-card">
                        Overall
                        <strong>${overallPercentage}%</strong>
                    </div>

                </div>

            </div>

<div style="margin-top:20px;">
    <h4 style="margin-bottom:12px;">Monthly Attendance</h4>

    <div id="monthlyAttendance">
    ${monthlyAttendanceHTML || `
        <div class="placeholder">
            No attendance records available yet.
        </div>
    `}
</div>
</div>
            <!-- DETAILS -->

            <div class="section">

                <h3>👤 Student Details</h3>

                <div class="details-grid">

                    <div class="detail">
                        <strong>Date of Birth</strong>
                        <span>${escapeHTML(student.dob || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Phone</strong>
                        <span>${escapeHTML(student.phone || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Email</strong>
                        <span>${escapeHTML(student.email || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Joining Date</strong>
                        <span>${escapeHTML(student.joiningDate || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Belt</strong>
                        <span>${escapeHTML(student.belt || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Status</strong>
                        <span>${escapeHTML(student.status || "-")}</span>
                    </div>

                </div>

            </div>


            <!-- ACHIEVEMENTS -->

            <div class="section">

                <h3>🏆 Achievements</h3>

                <div class="placeholder">
                    No achievements added yet.
                </div>

            </div>


            <!-- NOTICES -->

            <div class="section">

                <h3>📢 Notices & New Updates</h3>

                <div class="placeholder">
                    No new notices or updates.
                </div>

            </div>


            <!-- FEES -->

            <div class="section">

                <h3>💳 Fees</h3>

                <div class="fee-box">

                    <div>
                        <strong>Pending Fees</strong>
                        <p>₹0</p>
                    </div>

                    <button class="pay-btn">
                        Pay Fees
                    </button>

                </div>

            </div>

        `;

    } catch (error) {

        console.error(error);

        profile.innerHTML = `
            <div class="section">
                Unable to load student profile.
            </div>
        `;

    }

}


/* AUTH */

onAuthStateChanged(auth, (user) => {

    if (user) {
        loadStudentProfile();
    }

});


/* ESCAPE HTML */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
