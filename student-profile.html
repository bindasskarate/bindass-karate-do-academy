<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile | Bindass Karate Do Academy</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

.header {
    background: #111;
    color: white;
    padding: 20px;
}

.header h1 {
    font-size: 22px;
}

.header p {
    color: #bbb;
    margin-top: 5px;
    font-size: 13px;
}

.container {
    width: min(1100px, 94%);
    margin: 25px auto;
}

.back-btn {
    border: none;
    background: #333;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    margin-bottom: 18px;
}

.profile-header {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.profile-header h2 {
    font-size: 28px;
    margin-bottom: 8px;
}

.student-id {
    color: #777;
    font-size: 13px;
}

.status {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #dcfce7;
    color: #15803d;
    font-size: 12px;
    font-weight: bold;
}

.section {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.section h3 {
    font-size: 19px;
    margin-bottom: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
}

.details-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.detail {
    background: #f8fafc;
    padding: 14px;
    border-radius: 9px;
}

.detail strong {
    display: block;
    font-size: 12px;
    color: #777;
    margin-bottom: 5px;
}

.detail span {
    font-weight: bold;
}

.attendance-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.attendance-card {
    padding: 20px;
    border-radius: 12px;
    background: #f8fafc;
    text-align: center;
}

.attendance-card strong {
    display: block;
    font-size: 28px;
    margin-top: 6px;
}

.placeholder {
    color: #777;
    font-size: 14px;
    line-height: 1.6;
}

.fee-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: #f8fafc;
    padding: 18px;
    border-radius: 10px;
}

.pay-btn {
    border: none;
    background: #16a34a;
    color: white;
    padding: 11px 18px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #777;
}

@media (max-width: 650px) {

    .container {
        width: 94%;
    }

    .details-grid,
    .attendance-grid {
        grid-template-columns: 1fr;
    }

    .profile-header h2 {
        font-size: 23px;
    }

    .fee-box {
        flex-direction: column;
        align-items: stretch;
    }

    .pay-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>🥋 Bindass Karate Do Academy</h1>
    <p>Student Profile</p>
</header>

<main class="container">

    <button id="backToStudentsBtn" class="back-btn" onclick="window.location.href='students.html'">
    ← Back to Students
</button>

    <div id="profile">
        <div class="loading">
            Loading student profile...
        </div>
    </div>
    <div id="changePasswordSection" class="section" style="display:none;">

    <h3>🔐 Change Password</h3>

    <div style="max-width:500px;">

        <input
            type="password"
            id="currentPassword"
            placeholder="Current Password"
            style="
                width:100%;
                padding:12px;
                margin-bottom:10px;
                border:1px solid #ddd;
                border-radius:8px;
                font-size:15px;
            "
        >

        <input
            type="password"
            id="newPassword"
            placeholder="New Password"
            style="
                width:100%;
                padding:12px;
                margin-bottom:10px;
                border:1px solid #ddd;
                border-radius:8px;
                font-size:15px;
            "
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
            style="
                width:100%;
                padding:12px;
                margin-bottom:10px;
                border:1px solid #ddd;
                border-radius:8px;
                font-size:15px;
            "
        >

        <button
            id="changePasswordBtn"
            style="
                width:100%;
                padding:12px;
                border:none;
                border-radius:8px;
                background:#111;
                color:white;
                font-weight:bold;
                cursor:pointer;
            "
        >
            🔐 Change Password
        </button>

        <p
            id="passwordMessage"
            style="
                margin-top:12px;
                font-size:14px;
            "
        ></p>

    </div>

</div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    EmailAuthProvider,
    reauthenticateWithCredential,
    updatePassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

let currentStudent = null;

window.openPayment = function() {

    if (!studentId) return;

    const name =
        document.querySelector(".profile-header h2")
            ?.textContent
            .trim() || "Student";

    currentStudent = {
        id: studentId,
        name: name
    };

    document.getElementById("paymentStudentName")
        .textContent = name;

    document.getElementById("paymentModal")
        .style.display = "flex";
};


window.closePayment = function() {

    document.getElementById("paymentModal")
        .style.display = "none";

};


window.payViaUPI = async function() {

    const amount =
        document.getElementById("paymentAmount").value;

    if (!amount || Number(amount) <= 0) {
        alert("Please enter a valid amount.");
        return;
    }

    if (!currentStudent) {
        alert("Student information not found.");
        return;
    }

    const note =
        `BKD Fees - ${currentStudent.name}`;

    const upiURL =
        `upi://pay?pa=bindasskarate786@okhdfcbank` +
        `&pn=Bindass%20Karate%20Do%20Academy` +
        `&am=${encodeURIComponent(amount)}` +
        `&cu=INR` +
        `&tn=${encodeURIComponent(note)}`;

    try {

        const paymentDoc = await addDoc(
            collection(db, "payments"),
            {
                studentId: currentStudent.id,
                studentName: currentStudent.name,
                amount: Number(amount),
                upiId: "bindasskarate786@okhdfcbank",
                status: "Pending",
                transactionRef: "",
                paymentDate: null,
                createdAt: serverTimestamp()
            }
        );

        /*
         * Remember the payment request
         * even after leaving this page.
         */

        localStorage.setItem(
            "bkd_pending_payment",
            paymentDoc.id
        );

        /*
         * Open the student's UPI app
         */

window.location.assign(upiURL);
    } catch (error) {

        console.error(error);

        alert("Unable to create payment request.");

    }
};
async function checkPendingPayment() {

    const pendingPaymentId =
        localStorage.getItem("bkd_pending_payment");

    if (!pendingPaymentId) {
        return;
    }

    try {

        const paymentSnap = await getDoc(
            doc(db, "payments", pendingPaymentId)
        );

        if (!paymentSnap.exists()) {
            localStorage.removeItem("bkd_pending_payment");
            return;
        }

        const payment = paymentSnap.data();

        /*
         * Only show the UTR form if
         * this payment is still waiting.
         */

        if (
            payment.status === "Pending" &&
            !payment.transactionRef
        ) {

            lastPaymentId = pendingPaymentId;

            document.getElementById(
                "paymentReferenceModal"
            ).style.display = "flex";

        }

    } catch (error) {

        console.error(
            "Unable to check pending payment:",
            error
        );

    }
}

/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyCDpKF59MATfa-JaGF9yOBvHyi8i__3CFc",
  authDomain: "bindass-karate-do-academy.firebaseapp.com",
  projectId: "bindass-karate-do-academy",
  storageBucket: "bindass-karate-do-academy.firebasestorage.app",
  messagingSenderId: "360953215088",
  appId: "1:360953215088:web:c4399bcd991abf98229cb5",
  measurementId: "G-FWLX780V9Q"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const profile = document.getElementById("profile");



/* GET STUDENT ID FROM URL */

const params = new URLSearchParams(window.location.search);

const studentMode = params.get("student") === "1";

let studentId = params.get("id");
// ==========================================
// CHANGE STUDENT PASSWORD
// ==========================================

const changePasswordSection =
    document.getElementById("changePasswordSection");

const changePasswordBtn =
    document.getElementById("changePasswordBtn");

const passwordMessage =
    document.getElementById("passwordMessage");


if (studentMode) {
    changePasswordSection.style.display = "block";
}


changePasswordBtn.addEventListener("click", async () => {

    const user = auth.currentUser;

    if (!user) {
        passwordMessage.textContent =
            "Please login again before changing your password.";
        return;
    }

    const currentPassword =
        document.getElementById("currentPassword").value;

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (!currentPassword || !newPassword || !confirmPassword) {

        passwordMessage.textContent =
            "Please fill in all password fields.";

        return;
    }


    if (newPassword !== confirmPassword) {

        passwordMessage.textContent =
            "New passwords do not match.";

        return;
    }


    if (newPassword.length < 6) {

        passwordMessage.textContent =
            "New password must be at least 6 characters.";

        return;
    }


    if (currentPassword === newPassword) {

        passwordMessage.textContent =
            "New password must be different from your current password.";

        return;
    }


    passwordMessage.textContent =
        "Changing password...";


    try {

        const credential =
            EmailAuthProvider.credential(
                user.email,
                currentPassword
            );


        // Verify current password
        await reauthenticateWithCredential(
            user,
            credential
        );


        // Set new password
        await updatePassword(
            user,
            newPassword
        );


        passwordMessage.textContent =
            "✅ Password changed successfully!";


        document.getElementById("currentPassword").value = "";
        document.getElementById("newPassword").value = "";
        document.getElementById("confirmPassword").value = "";


    } catch (error) {

        console.error(
            "Password change error:",
            error
        );


        if (
            error.code ===
            "auth/invalid-credential" ||
            error.code ===
            "auth/wrong-password"
        ) {

            passwordMessage.textContent =
                "❌ Current password is incorrect.";

        } else if (
            error.code ===
            "auth/weak-password"
        ) {

            passwordMessage.textContent =
                "❌ New password is too weak.";

        } else if (
            error.code ===
            "auth/requires-recent-login"
        ) {

            passwordMessage.textContent =
                "❌ Please logout and login again, then change your password.";

        } else {

            passwordMessage.textContent =
                "❌ Unable to change password. Please try again.";

        }

    }

});

/* LOAD PROFILE */

async function loadStudentProfile() {

    if (!studentId) {

        profile.innerHTML = `
            <div class="section">
                Student ID not found.
            </div>
        `;

        return;
    }

    try {

        const studentRef = doc(db, "students", studentId);
        const studentSnap = await getDoc(studentRef);

        if (!studentSnap.exists()) {

            profile.innerHTML = `
                <div class="section">
                    Student not found.
                </div>
            `;

            return;
        }

        const student = studentSnap.data();
        // MONTHLY FEE CALCULATION

const monthlyFee = Number(student.monthlyFee) || 0;

let completedMonths = 0;

if (student.joiningDate && monthlyFee > 0) {

    const joiningDate = new Date(student.joiningDate + "T00:00:00");
    const today = new Date();

    completedMonths =
        (today.getFullYear() - joiningDate.getFullYear()) * 12 +
        (today.getMonth() - joiningDate.getMonth());

    // If this month's joining-date day has not arrived yet,
    // the current month is not completed.
    if (today.getDate() < joiningDate.getDate()) {
        completedMonths--;
    }

    if (completedMonths < 0) {
        completedMonths = 0;
    }
}

const totalMonthlyFees =
    completedMonths * monthlyFee;
    // GET VERIFIED PAYMENTS

// ==========================================
// FEES + PAYMENT CALCULATION
// ==========================================

// 1. VERIFIED ONLINE / UPI PAYMENTS

const paymentsSnapshot = await getDocs(
    collection(db, "payments")
);

let verifiedPaymentsTotal = 0;

paymentsSnapshot.forEach((paymentDoc) => {

    const payment = paymentDoc.data();

    if (
        payment.studentId === studentId &&
        payment.status === "Paid"
    ) {
        verifiedPaymentsTotal +=
            Number(payment.amount) || 0;
    }

});


// ==========================================
// 2. FEE MANAGEMENT RECORDS
// ==========================================

const feesSnapshot = await getDocs(
    collection(db, "fees")
);

let pendingOtherFees = 0;
let paidOtherFees = 0;

const studentFeeRecords = [];

feesSnapshot.forEach((feeDoc) => {

    const fee = feeDoc.data();

    if (fee.studentId !== studentId) {
        return;
    }

    const amount = Number(fee.amount) || 0;

    studentFeeRecords.push({
    id: feeDoc.id,
    source: "fees",
    ...fee,
    amount: amount
});
    if (fee.status === "Paid") {

        paidOtherFees += amount;

    } else {

        pendingOtherFees += amount;

    }

});
// ==========================================
// ADD VERIFIED PAYMENTS TO FEE HISTORY
// ==========================================

paymentsSnapshot.forEach((paymentDoc) => {

    const payment = paymentDoc.data();

    if (
        payment.studentId !== studentId ||
        payment.status !== "Paid"
    ) {
        return;
    }

    studentFeeRecords.push({
    id: paymentDoc.id,
    source: "payments",
    receiptNumber: payment.receiptNumber || "",
    feeMonth: payment.feeMonth || "",
    feeMonthName: payment.feeMonthName || "",
    type: payment.type || "Monthly Fee",
    description:
        payment.description ||
        "Monthly Fee Payment",
    amount: Number(payment.amount) || 0,
    status: "Paid",
    feeDate:
        payment.paymentDate ||
        "",
    paymentDate:
        payment.paymentDate ||
        "",
    paymentMethod:
        payment.paymentMethod ||
        "",
    paymentReference:
        payment.paymentReference ||
        payment.transactionRef ||
        "",
    transactionRef:
        payment.transactionRef ||
        ""
});

});

// ==========================================
// 3. FINAL PENDING FEE
// ==========================================

// Monthly dues are calculated automatically
// from joining date + monthly fee.

const pendingMonthlyFee =
    Math.max(
        0,
        totalMonthlyFees - verifiedPaymentsTotal
    );

// Add pending Tournament / Equipment / Exam etc.

const pendingFee =
    pendingMonthlyFee + pendingOtherFees;


// ==========================================
// 4. TOTAL PAID
// ==========================================

const totalPaid =
    verifiedPaymentsTotal + paidOtherFees;

        const attendanceSnapshot = await getDocs(
    collection(db, "attendance")
);

let totalDays = 0;
let presentDays = 0;
let monthlyTotal = 0;
let monthlyPresent = 0;

const currentMonth = new Date().toISOString().slice(0, 7);
const currentYear = new Date().getFullYear().toString();

attendanceSnapshot.forEach((attendanceDoc) => {

    const date = attendanceDoc.id;
    const data = attendanceDoc.data();
    const status = data.records?.[studentId];

    if (!status) return;

    totalDays++;

    if (status === "Present") {
        presentDays++;
    }

    if (date.startsWith(currentMonth)) {

        monthlyTotal++;

        if (status === "Present") {
            monthlyPresent++;
        }
    }
});
const monthlyData = {};

attendanceSnapshot.forEach((attendanceDoc) => {

    const date = attendanceDoc.id;
    const data = attendanceDoc.data();
    const status = data.records?.[studentId];

    if (!status) return;

    const month = date.slice(0, 7);

    if (!monthlyData[month]) {
        monthlyData[month] = {
            total: 0,
            present: 0
        };
    }

    monthlyData[month].total++;

    if (status === "Present") {
        monthlyData[month].present++;
    }
});
const overallPercentage =
    totalDays > 0
        ? Math.round((presentDays / totalDays) * 100)
        : 0;

const monthlyPercentage =
    monthlyTotal > 0
        ? Math.round((monthlyPresent / monthlyTotal) * 100)
        : 0;
const monthlyAttendanceHTML =
    Object.keys(monthlyData)
        .sort()
        .map(month => {

            const data = monthlyData[month];

            const percentage =
                Math.round((data.present / data.total) * 100);

            const monthName =
                new Date(month + "-01").toLocaleString(
                    "en-US",
                    { month: "long", year: "numeric" }
                );

            return `getAuth
                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    padding:14px;
                    margin-bottom:8px;
                    background:#f8fafc;
                    border-radius:9px;
                ">
                    <strong>${monthName}</strong>

                    <span>
                        ${data.present}/${data.total}
                        &nbsp;•&nbsp;
                        <strong>${percentage}%</strong>
                    </span>
                </div>
            `;
        })
        .join("");
        profile.innerHTML = `

            <div class="profile-header">

                <h2>
                    ${escapeHTML(student.name || "Unnamed Student")}
                </h2>

                <div class="student-id">
                    Student ID: ${escapeHTML(studentId)}
                </div>

                <span class="status">
                    ${escapeHTML(student.status || "Active")}
                </span>

            </div>


            <!-- ATTENDANCE -->

            <div class="section">

                <h3>📊 Attendance</h3>

                <div class="attendance-grid">

                    <div class="attendance-card">
                        This Month
                        <strong>${monthlyPercentage}%</strong>
                    </div>

                    <div class="attendance-card">
                        This Year
                        <strong>${overallPercentage}%</strong>
                    </div>

                    <div class="attendance-card">
                        Overall
                        <strong>${overallPercentage}%</strong>
                    </div>

                </div>

            </div>

<div style="margin-top:20px;">
    <h4 style="margin-bottom:12px;">Monthly Attendance</h4>

    <div id="monthlyAttendance">
    ${monthlyAttendanceHTML || `
        <div class="placeholder">
            No attendance records available yet.
        </div>
    `}
</div>
</div>
            <!-- DETAILS -->

            <div class="section">

                <h3>👤 Student Details</h3>

                <div class="details-grid">

                    <div class="detail">
                        <strong>Date of Birth</strong>
                        <span>${escapeHTML(student.dob || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Phone</strong>
                        <span>${escapeHTML(student.phone || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Email</strong>
                        <span>${escapeHTML(student.email || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Joining Date</strong>
                        <span>${escapeHTML(student.joiningDate || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Belt</strong>
                        <span>${escapeHTML(student.belt || "-")}</span>
                    </div>

                    <div class="detail">
                        <strong>Status</strong>
                        <span>${escapeHTML(student.status || "-")}</span>
                    </div>

                </div>

            </div>


            <!-- ACHIEVEMENTS -->

            <div class="section">

                <h3>🏆 Achievements</h3>

                <div class="placeholder">
                    No achievements added yet.
                </div>

            </div>


            <!-- NOTICES -->

            <div class="section">

                <h3>📢 Notices & New Updates</h3>

                <div class="placeholder">
                    No new notices or updates.
                </div>

            </div>


            <!-- FEES -->

<div class="section">

    <h3>💳 Fees & Payment</h3>

    <div class="details-grid">

        <div class="detail">
            <strong>Monthly Fee</strong>
            <span id="monthlyFee">
                ₹${monthlyFee}
            </span>
        </div>

        <div class="detail">
            <strong>Monthly Dues</strong>
            <span>
                ₹${totalMonthlyFees}
            </span>
        </div>

        <div class="detail">
            <strong>Other Pending Fees</strong>
            <span>
                ₹${pendingOtherFees}
            </span>
        </div>

        <div class="detail">
            <strong>Total Paid</strong>
            <span>
                ₹${totalPaid}
            </span>
        </div>

        <div class="detail">
            <strong>Pending Fee</strong>
            <span id="pendingFee">
                ₹${pendingFee}
            </span>
        </div>

        <div class="detail">
            <strong>Payment Status</strong>
            <span id="paymentStatus">
                ${pendingFee > 0 ? "Pending" : "Paid"}
            </span>
        </div>

    </div>


    <!-- FEE HISTORY -->

    <div style="margin-top:25px;">

        <h4 style="margin-bottom:12px;">
            📋 Fee History
        </h4>

        ${
            studentFeeRecords.length === 0
                ? `
                    <div class="detail">
                        No additional fee records found.
                    </div>
                  `
                : `
                    <div style="overflow-x:auto;">

                        <table style="
                            width:100%;
                            border-collapse:collapse;
                            min-width:600px;
                        ">

                            <thead>

                                <tr>

                                    <th style="
                                        text-align:left;
                                        padding:10px;
                                    ">
                                        Date
                                    </th>

                                    <th style="
                                        text-align:left;
                                        padding:10px;
                                    ">
                                        Type
                                    </th>

                                    <th style="
                                        text-align:left;
                                        padding:10px;
                                    ">
                                        Description
                                    </th>

                                    <th style="
                                        text-align:left;
                                        padding:10px;
                                    ">
                                        Amount
                                    </th>

                                    <th style="
                                        text-align:left;
                                        padding:10px;
                                    ">
                                        Status
                                    </th>

                                </tr>

                            </thead>

                            <tbody>

                                ${
                                    studentFeeRecords
                                    .sort((a, b) =>
                                        String(b.feeDate || "")
                                        .localeCompare(
                                            String(a.feeDate || "")
                                        )
                                    )
                                    .map(fee => `
                                        <tr>

                                            <td style="
                                                padding:10px;
                                            ">
                                                ${fee.feeDate || "-"}
                                            </td>

                                            <td style="
                                                padding:10px;
                                            ">
                                                ${fee.type || "-"}
                                            </td>

                                            <td style="
                                                padding:10px;
                                            ">
                                                ${fee.description || "-"}
                                            </td>

                                            <td style="
                                                padding:10px;
                                            ">
                                                ₹${fee.amount}
                                            </td>

                                            <td style="
    padding:10px;
    font-weight:600;
">
    ${
        fee.status === "Paid"
            ? `
                <div>
                    <span>Paid</span>

                    ${
                        fee.id && fee.receiptNumber
                            ? `

if (studentMode && backBtn) {

}

/* ESCAPE HTML */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}
import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

;
let lastPaymentId = null;
window.openPaymentReference = function(paymentId) {

    lastPaymentId = paymentId;

    document.getElementById("transactionReference").value = "";

    document.getElementById("paymentReferenceModal")
        .style.display = "flex";
};
window.closePaymentReference = function() {

    document.getElementById("paymentReferenceModal")
        .style.display = "none";
};
window.submitPaymentReference = async function() {

    const reference =
        document.getElementById("transactionReference")
            .value
            .trim();

    if (!reference) {

        alert("Please enter the UTR / Transaction Reference.");

        return;
    }

    if (!lastPaymentId) {

        alert("Payment request not found.");

        return;
    }

    try {

        const paymentRef =
            doc(db, "payments", lastPaymentId);

        /*
         * IMPORTANT:
         * Payment remains Pending.
         * Admin will verify it later.
         */

        await updateDoc(paymentRef, {

            transactionRef: reference,

            submittedAt: serverTimestamp(),

            status: "Pending Verification"

        });
        localStorage.removeItem("bkd_pending_payment");

        closePaymentReference();

        alert(
            "Payment details submitted successfully.\n\n" +
            "Your payment is now pending verification by the academy."
        );

    } catch (error) {

        console.error(error);

        alert(
            "Unable to submit payment details."
        );

    }
};
